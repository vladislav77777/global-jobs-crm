[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "global-jobs-crm"
version = "0.3.0"
description = "Agent-assisted job collection, guarded delivery and response tracking with Notion"
requires-python = ">=3.11"
dependencies = ["tzdata; platform_system == 'Windows'"]

[tool.setuptools]
packages = ["crm"]
